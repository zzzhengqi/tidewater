name: Deploy to GitHub Pages

# The site: this branch (main, the released version) at the root, https://zzzhengqi.github.io/tidewater/,
# and the v2 preview (branch main-v2) under /v2/, https://zzzhengqi.github.io/tidewater/v2/. Both builds use
# relative asset paths, so each runs from its own folder. To publish a new main-v2: Actions -> Deploy to
# GitHub Pages -> Run workflow (branch main). On this fork GitHub does not start workflows on push.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # the v2 preview, from its own branch, into dist/v2
      - uses: actions/checkout@v4
        with:
          ref: main-v2
          path: v2-src
      - run: npm ci
        working-directory: v2-src
      - run: npm run build
        working-directory: v2-src
      - run: |
          mkdir -p dist/v2
          cp -r v2-src/dist/. dist/v2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
